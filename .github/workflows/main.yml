name: CI and deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Vitest)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || vars.DIRECT_URL }}
        run: npm run test

      - name: Lint (ESLint)
        run: npm run lint

  deploy:
    needs: test
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK não definido — deploy ignorado (configure o secret no repositório)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
